cefr_descriptors:
  # locate_information
  - skill_code: "locate_information"
    level: "A1"
    descriptor: "Peut repérer des mots familiers, des noms et des chiffres très simples (dates, heures, prix) dans une annonce ou un message basique."
    evidence_guidance: "Sélection directe d'une coordonnée ou d'une heure sans reformulation complexe ni distracteurs lexicalement proches."

  - skill_code: "locate_information"
    level: "A2"
    descriptor: "Peut localiser une information factuelle prévisible dans des documents quotidiens (horaires de bus, petites annonces, menus)."
    evidence_guidance: "Recherche ciblée dans un document illustré avec présence de 2 à 3 distracteurs numériques ou temporels."

  - skill_code: "locate_information"
    level: "B1"
    descriptor: "Peut parcourir rapidement un texte informatif ou administratif pour localiser des conditions ou consignes spécifiques dispersées."
    evidence_guidance: "Balayage d'un avis officiel d'une page avec variation lexicale entre la question et le texte."

  # identify_main_idea
  - skill_code: "identify_main_idea"
    level: "A2"
    descriptor: "Peut identifier le sujet principal d'un message court ou d'une annonce simple."
    evidence_guidance: "Choix du thème général parmi 4 options contrastées."

  - skill_code: "identify_main_idea"
    level: "B1"
    descriptor: "Peut dégager l'idée directrice et les points essentiels d'un article informatif ou d'une communication professionnelle standard."
    evidence_guidance: "Distinction de l'idée directrice par rapport aux exemples illustratifs d'un paragraphe."

  - skill_code: "identify_main_idea"
    level: "B2"
    descriptor: "Peut saisir la problématique centrale et l'orientation globale d'un article d'analyse ou d'un éditorial complexe."
    evidence_guidance: "Identification de la thèse de fond dans un texte journalistique contenant des digressions et nuances."

  - skill_code: "identify_main_idea"
    level: "C1"
    descriptor: "Peut identifier avec précision l'angle d'analyse et les enjeux implicites d'un essai ou article de réflexion approfondie."
    evidence_guidance: "Reconnaissance d'une thèse complexe formulée de manière allusive ou rhétorique."

  # infer_implicit_information
  - skill_code: "infer_implicit_information"
    level: "B1"
    descriptor: "Peut déduire des conclusions simples et des motifs sous-jacents évidents à partir d'indices factuels du texte ou de l'audio."
    evidence_guidance: "Déduction d'une cause probable non explicite mais directement suggérée par l'enchaînement des faits."

  - skill_code: "infer_implicit_information"
    level: "B2"
    descriptor: "Peut inférer des présupposés, des motivations inavouées ou des conséquences prévisibles dans des textes et discours élaborés."
    evidence_guidance: "Sélection d'une conclusion implicite requérant le croisement de plusieurs indices contextuels."

  - skill_code: "infer_implicit_information"
    level: "C1"
    descriptor: "Peut restituer avec finesse les non-dits, arrière-pensées et implications idéologiques ou institutionnelles d'un discours."
    evidence_guidance: "Interprétation d'un sous-entendu critique au sein d'un texte polémique ou d'une intervention orale diplomatique."

  # identify_stance_and_perspective
  - skill_code: "identify_stance_and_perspective"
    level: "B1"
    descriptor: "Peut identifier l'accord ou le désaccord global d'un auteur ou locuteur face à une situation concrète."
    evidence_guidance: "Reconnaissance d'un avis favorable ou défavorable exprimé à l'aide de marqueurs d'appréciation simples."

  - skill_code: "identify_stance_and_perspective"
    level: "B2"
    descriptor: "Peut discerner la position argumentée, les réserves et les nuances d'opinion d'un auteur sur un sujet controversé."
    evidence_guidance: "Détection d'une prise de position mesurée (oui avec réserves) face à des distracteurs binaires (pour/contre)."

  - skill_code: "identify_stance_and_perspective"
    level: "C1"
    descriptor: "Peut déconstruire une posture argumentative sophistiquée, déceler l'ironie ou la distanciation critique."
    evidence_guidance: "Identification de la position réelle d'un auteur utilisant l'antiphrase ou la concession feinte."

  # vocabulary_in_context
  - skill_code: "vocabulary_in_context"
    level: "A1"
    descriptor: "Comprend les mots courants et expressions de base relatives aux besoins immédiats et concrets."
    evidence_guidance: "Identification du sens de termes du quotidien (alimentation, logement, famille)."

  - skill_code: "vocabulary_in_context"
    level: "A2"
    descriptor: "Comprend le vocabulaire usuel relatif aux domaines d'intérêt courant et à l'environnement quotidien."
    evidence_guidance: "Choix du mot approprié parmi des distracteurs de champs sémantiques distincts."

  - skill_code: "vocabulary_in_context"
    level: "B1"
    descriptor: "Comprend le lexique professionnel et courant, et déduit le sens de mots inconnus simples par le contexte."
    evidence_guidance: "Compréhension de termes spécifiques insérés dans des phrases d'explication ou des annonces."

  - skill_code: "vocabulary_in_context"
    level: "B2"
    descriptor: "Possède une bonne maîtrise du vocabulaire abstrait, technique ou imagé, et saisit le sens contextuel précis de termes polysémiques."
    evidence_guidance: "Identification de l'acception exacte d'un verbe ou adjectif polysémique dans un texte d'opinion."

  - skill_code: "vocabulary_in_context"
    level: "C1"
    descriptor: "Maîtrise un répertoire lexical étendu incluant tournures idiomatiques, vocabulaire soutenu et nuances fines."
    evidence_guidance: "Sélection ou compréhension de termes spécialisés, rares ou métaphoriques sans ambiguïté."

  # discourse_connectors
  - skill_code: "discourse_connectors"
    level: "A2"
    descriptor: "Utilise et comprend des connecteurs chronologiques et logiques très simples (et, mais, alors, parce que, puis)."
    evidence_guidance: "Sélection du bon connecteur de base dans une phrase courte coordonnée."

  - skill_code: "discourse_connectors"
    level: "B1"
    descriptor: "Comprend et utilise des connecteurs d'opposition, de cause et de conséquence courants (cependant, donc, car, pourtant, ainsi)."
    evidence_guidance: "Complétion de lacunes dans un texte avec choix entre connecteurs de sens contrastés."

  - skill_code: "discourse_connectors"
    level: "B2"
    descriptor: "Maîtrise un éventail varié d'articulateurs logiques complexes (néanmoins, en revanche, par conséquent, d'autant plus que, bien que)."
    evidence_guidance: "Insertion adéquate d'un articulateur de concession ou de nuance dans un paragraphe argumenté."

  - skill_code: "discourse_connectors"
    level: "C1"
    descriptor: "Mobilise avec souplesse et variété les connecteurs logiques et transitions discursives pour ordonner une pensée complexe."
    evidence_guidance: "Emploi sans faille de transitions rhétoriques soutenues assurant un enchaînement textuel impeccable."

  # tense_selection
  - skill_code: "tense_selection"
    level: "A2"
    descriptor: "Distingue et utilise les formes simples du présent, du passé composé et du futur proche."
    evidence_guidance: "Sélection du passé composé pour une action achevée dans le passé."

  - skill_code: "tense_selection"
    level: "B1"
    descriptor: "Maîtrise l'alternance fondamentale passé composé / imparfait dans un récit au passé et emploie le futur simple."
    evidence_guidance: "Choix correct entre imparfait (description, habitude) et passé composé (événement ponctuel)."

  - skill_code: "tense_selection"
    level: "B2"
    descriptor: "Gère la concordance des temps complexe incluant plus-que-parfait, conditionnel présent/passé et futur antérieur."
    evidence_guidance: "Respect rigoureux de l'antériorité dans le passé au sein d'une narration élaborée ou d'une phrase hypothétique."

  # mood_selection
  - skill_code: "mood_selection"
    level: "B1"
    descriptor: "Utilise le subjonctif présent après les structures d'obligation impersonnelle courantes (il faut que...)."
    evidence_guidance: "Sélection de la forme subjonctive après 'il faut que' ou verbes de volonté simples."

  - skill_code: "mood_selection"
    level: "B2"
    descriptor: "Maîtrise l'opposition indicatif / subjonctif après verbes d'opinion (négation/interrogation), sentiment, doute et conjonctions."
    evidence_guidance: "Choix systématique du mode approprié après 'bien que', 'pour que', 'avant que' et 'je ne pense pas que'."

  - skill_code: "mood_selection"
    level: "C1"
    descriptor: "Maîtrise les nuances subtiles entre indicatif, subjonctif et conditionnel dans des contextes stylistiques variés."
    evidence_guidance: "Utilisation du conditionnel journalistique d'information non confirmée et subjonctif dans les relatives à nuance d'hypothèse."
