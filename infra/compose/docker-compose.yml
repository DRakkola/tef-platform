# Pinned infrastructure image versions:
# - PostgreSQL: postgres:18.0-alpine3.22 (Current supported major)
# - Redis: redis:7.4.2-alpine (Authenticated, AOF persistent)
# - MinIO: minio/minio:RELEASE.2025-02-18T16-25-55Z (S3 object storage)
# - MinIO Client: minio/mc:RELEASE.2025-02-21T16-00-46Z (Bucket initialization)
# - Python runtime: python:3.14-slim (Non-root user appuser:10001)
# - Web runtime: node:24-alpine & nginx:1.27-alpine

services:
  postgres:
    profiles: ["local-infra"]
    image: postgres:17-alpine
    container_name: tef-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tef_platform}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-tef_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-tef_admin_secret}
      POSTGRES_APP_USER: ${POSTGRES_USER:-tef_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-tef_app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-tef_admin} -d ${POSTGRES_DB:-tef_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-network

  redis:
    image: redis:7-alpine
    container_name: tef-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tef_redis_password}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tef_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - tef-network

  minio:
    profiles: ["local-infra"]
    image: minio/minio:latest
    container_name: tef-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin_dev_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - tef-network

  minio-init:
    profiles: ["local-infra"]
    image: minio/minio:latest
    container_name: tef-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      MINIO_HOST: minio
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin_dev_secret}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-tef-private}
    volumes:
      - ../docker/minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    networks:
      - tef-network

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: tef-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../apps/api/.env
    environment:
      ENVIRONMENT: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-network

  celery-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: tef-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "INFO", "-c", "2"]
    env_file:
      - ../../apps/api/.env
    environment:
      ENVIRONMENT: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-tef_redis_password}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://lisekikckvvjshculasd.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: tef-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - tef-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  tef-network:
    driver: bridge
