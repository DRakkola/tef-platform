# ==============================================================================
# TEF Platform — Staging Compose Stack
# ==============================================================================
# Architecture:
# - Dual isolated networks: tef-public-net (DMZ) & tef-internal-net (isolated private)
# - Zero host-exposed database, redis, or object storage ports
# - Ingress traffic terminates at reverse proxy / web
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: tef-staging-postgres
    restart: unless-stopped
    # Strictly NO host port binding in staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tef_staging}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-tef_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_USER:-tef_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-tef_admin} -d ${POSTGRES_DB:-tef_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-internal-net

  redis:
    image: redis:7-alpine
    container_name: tef-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    # Strictly NO host port binding in staging
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - tef-internal-net

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: tef-staging-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    # Strictly NO host port binding in staging
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - tef-internal-net

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: tef-staging-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tef_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-tef-staging-private}
      STORAGE_USE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.tef-prep.example.com}
      SECRET_KEY: ${SECRET_KEY}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-internal-net
      - tef-public-net

  celery-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: tef-staging-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "INFO", "-c", "4"]
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tef_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-tef-staging-private}
      STORAGE_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - tef-internal-net

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: tef-staging-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - tef-public-net

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_minio_data:

networks:
  tef-public-net:
    driver: bridge
  tef-internal-net:
    internal: true
    driver: bridge
