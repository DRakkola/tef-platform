services:
  postgres:
    image: postgres:18-alpine
    container_name: tef-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tef_password}
      POSTGRES_DB: ${POSTGRES_DB:-tef_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tef} -d ${POSTGRES_DB:-tef_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
